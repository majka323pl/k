<!DOCTYPE html><html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prosty komunikator</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; display:flex; height:100vh; }
    #sidebar { width:30%; border-right:1px solid #ccc; padding:10px; box-sizing:border-box; }
    #chat { flex:1; display:flex; flex-direction:column; }
    #messages { flex:1; overflow-y:auto; padding:10px; border-bottom:1px solid #ccc; }
    #inputBar { display:flex; padding:10px; gap:10px; }
    input, button { padding:8px; }
    .group { padding:6px; cursor:pointer; }
    .group:hover { background:#eee; }
  </style>
</head>
<body><div id="loginScreen" style="margin:auto; text-align:center;">
  <h2>Logowanie</h2>
  <input id="loginInput" placeholder="Nick" />
  <br><br>
  <button onclick="login()">Zaloguj</button>
</div><div id="app" style="display:none; width:100%;">
  <div id="sidebar">
    <h3>Grupy</h3>
    <div id="groups"></div>
    <button onclick="createGroup()">+ Nowa grupa</button>
  </div>  <div id="chat">
    <h3 id="groupName" style="padding:10px; margin:0;">Wybierz grupę</h3>
    <div id="messages"></div>
    <div id="inputBar">
      <input id="messageInput" placeholder="Wiadomość..." style="flex:1;" />
      <button onclick="sendMessage()">Wyślij</button>
    </div>
  </div>
</div><script>
let user = null;
let groups = JSON.parse(localStorage.getItem('groups') || '[]');
let currentGroup = null;

function save() {
  localStorage.setItem('groups', JSON.stringify(groups));
}

function login() {
  const val = document.getElementById('loginInput').value.trim();
  if (!val) return;
  user = val;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderGroups();
}

function renderGroups() {
  const el = document.getElementById('groups');
  el.innerHTML = '';
  groups.forEach(g => {
    const div = document.createElement('div');
    div.className = 'group';
    div.textContent = g.name;
    div.onclick = () => selectGroup(g.name);
    el.appendChild(div);
  });
}

function createGroup() {
  const name = prompt('Nazwa grupy:');
  if (!name) return;
  groups.push({ name, messages: [] });
  save();
  renderGroups();
}

function selectGroup(name) {
  currentGroup = groups.find(g => g.name === name);
  document.getElementById('groupName').textContent = name;
  renderMessages();
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  if (!currentGroup) return;
  currentGroup.messages.forEach(m => {
    const div = document.createElement('div');
    div.innerHTML = `<b>${m.user}:</b> ${m.text}`;
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !currentGroup) return;
  currentGroup.messages.push({ user, text });
  save();
  input.value = '';
  renderMessages();
}
</script></body>
</html>
