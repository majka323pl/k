<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Remote Control</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #panel { max-width: 600px; margin: auto; border: 1px solid #333; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #111; color: #fff; border: 1px solid #0f0; }
        button { width: 100%; padding: 15px; background: #004400; color: #fff; border: 1px solid #0f0; cursor: pointer; }
        button:hover { background: #006600; }
        #raw { white-space: pre; background: #fff; color: #000; padding: 0; margin: 0; display: none; }
    </style>
</head>
<body>
    <!-- STRONA DO ZARZĄDZANIA -->
    <div id="panel">
        <h2>🛰️ Panel Sterowania</h2>
        <textarea id="codeText" placeholder="Wpisz kod Lua..."></textarea><br><br>
        <button onclick="sendUpdate()">ZAKTUALIZUJ I WYŚLIJ (EXECUTE)</button>
        <p id="status">Status: Oczekiwanie...</p>
    </div>

    <!-- STRONA ?key=1 (Ukryta dla ludzi, widoczna dla Robloxa) -->
    <div id="raw"></div>

    <script>
        // --- KONFIGURACJA (WPISZ SWOJE DANE) ---
        const CONFIG = {
            token: "TWÓJ_TOKEN_GITHUB_TUTAJ", // Wklej token tutaj
            user: "TWÓJ_USERNAME",
            repo: "TWOJE_REPO",
            file: "command.lua"
        };
        // ---------------------------------------

        const urlParams = new URLSearchParams(window.location.search);

        // FUNKCJA OBSŁUGI ?key=1
        async function checkView() {
            if (urlParams.get('key') === '1') {
                document.getElementById('panel').style.display = 'none';
                document.getElementById('raw').style.display = 'block';
                document.body.style.background = "#fff";
                
                // Pobieranie aktualnej zawartości
                const r = await fetch(`https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/main/${CONFIG.file}?t=${Date.now()}`);
                const txt = await r.text();
                document.getElementById('raw').innerText = txt;
            }
        }

        // FUNKCJA ZMIANY ZAWARTOŚCI (ZAPISYWANIE)
        async function sendUpdate() {
            const newCode = document.getElementById('codeText').value;
            const status = document.getElementById('status');
            const apiUrl = `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.file}`;

            status.innerText = "Łączenie z pamięcią...";

            try {
                // 1. Pobierz SHA (identyfikator wersji)
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${CONFIG.token}` }
                });
                const getData = await getRes.json();

                // 2. Wyślij nową zawartość
                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { 
                        "Authorization": `token ${CONFIG.token}`,
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        message: "Update via Panel",
                        content: btoa(unescape(encodeURIComponent(newCode))),
                        sha: getData.sha
                    })
                });

                if (putRes.ok) {
                    status.innerText = "✅ Sukces! Kod zmieniony. Roblox odbierze go za chwilę.";
                } else {
                    status.innerText = "❌ Błąd zapisu (sprawdź token lub nazwy).";
                }
            } catch (e) {
                status.innerText = "❌ Krytyczny błąd połączenia.";
            }
        }

        checkView();
    </script>
</body>
</html>
