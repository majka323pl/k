<!DOCTYPE html>
<html>
<head>
    <title>Remote Exec Panel</title>
    <style>
        body { background: #1e1e1e; color: white; font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #333; color: #0f0; border: 1px solid #555; }
        input, button { margin-top: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h2>Remote Executor</h2>
    <input type="password" id="token" placeholder="GitHub Token (PAT)">
    <textarea id="code" placeholder="Wpisz kod Lua tutaj..."></textarea><br>
    <button onclick="sendCommand()">WYŚLIJ KOD</button>

    <script>
        async function sendCommand() {
            const token = document.getElementById('token').value;
            const code = document.getElementById('code').value;
            const repo = "TwójUsername/my-remote-exec";
            const path = "command.lua";
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;

            // 1. Pobierz aktualne SHA pliku
            const getRes = await fetch(url, { headers: { Authorization: `token ${token}` } });
            const getData = await getRes.json();
            const sha = getData.sha;

            // 2. Zaktualizuj plik
            const res = await fetch(url, {
                method: "PUT",
                headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Update command",
                    content: btoa(code), // Kodowanie do Base64
                    sha: sha
                })
            });

            if(res.ok) alert("Wysłano pomyślnie!");
            else alert("Błąd: " .. (await res.text()));
        }
    </script>
</body>
</html>
