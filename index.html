<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Remote Control Panel</title>
    <style>
        body { background: #121212; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 800px; margin: auto; border: 1px solid #333; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 250px; background: #1e1e1e; color: #fff; border: 1px solid #444; padding: 10px; margin: 10px 0; }
        input { background: #1e1e1e; color: white; border: 1px solid #444; padding: 8px; width: 300px; }
        button { background: #008800; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00aa00; }
        #status { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="main-ui" class="container">
        <h2>🛰️ Remote Executor Panel</h2>
        <p>Wprowadź swój GitHub Token (PAT), aby zaktualizować komendę:</p>
        <input type="password" id="token" placeholder="GitHub Personal Access Token">
        <textarea id="code" placeholder="-- Wpisz tutaj kod Lua, który ma się wykonać u odbiorcy..."></textarea>
        <button onclick="updateCommand()">WYŚLIJ KOD</button>
        <p id="status">Status: Oczekiwanie...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const user = "majka323pl"; // <-- ZMIEŃ TO
        const repo = "k";     // <-- ZMIEŃ TO
        const path = "command.lua";
        const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;

        async function init() {
            // Jeśli w URL jest ?kod=1, wyświetl tylko surową zawartość pliku command.lua
            if (urlParams.get('kod') === '1') {
                document.body.innerHTML = "Wczytywanie kodu...";
                const res = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/${path}?t=${Date.now()}`);
                const code = await res.text();
                document.body.innerText = code;
                document.body.style.whiteSpace = "pre";
                return;
            }
        }

        async function updateCommand() {
            const token = document.getElementById('token').value;
            const code = document.getElementById('code').value;
            const status = document.getElementById('status');

            if (!token) return alert("Podaj token!");

            status.innerText = "Łączenie z GitHub...";
            
            try {
                const getRes = await fetch(apiUrl, { headers: { Authorization: `token ${token}` } });
                const getData = await getRes.json();
                const sha = getData.sha;

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "Remote execution update",
                        content: btoa(code), // Base64
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    status.innerText = "✅ Sukces! Kod został zaktualizowany.";
                    alert("Kod wysłany. Odbiorca otrzyma go za ok. 30-60s.");
                } else {
                    status.innerText = "❌ Błąd: " + putRes.status;
                }
            } catch (e) {
                status.innerText = "❌ Błąd połączenia.";
            }
        }

        init();
    </script>
</body>
</html>
