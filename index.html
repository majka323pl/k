<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control Panel</title>
    <style>
        body { background: #0f0f0f; color: #00ff41; font-family: 'Consolas', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1a1a1a; padding: 30px; border: 1px solid #333; border-radius: 10px; width: 90%; max-width: 700px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; color: #fff; }
        textarea { width: 100%; height: 300px; background: #050505; color: #00ff41; border: 1px solid #444; padding: 10px; box-sizing: border-box; font-family: 'Consolas', monospace; resize: none; margin: 15px 0; }
        input { width: 100%; padding: 12px; background: #050505; border: 1px solid #444; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; background: #0066cc; color: white; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #0052a3; box-shadow: 0 0 10px #0066cc; }
        #status { margin-top: 15px; font-size: 0.85em; color: #aaa; text-align: center; }
    </style>
</head>
<body>
    <div id="ui" class="box">
        <h2>CMD EXECUTION PANEL</h2>
        <input type="password" id="token" placeholder="Wklej GitHub Personal Access Token (PAT)">
        <textarea id="code" placeholder="-- Wpisz kod Lua do wykonania..."></textarea>
        <button onclick="updateFile()">EXECUTE ON ALL CLIENTS</button>
        <div id="status">Status: Gotowy</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        // --- KONFIGURACJA ---
        const USER = "TWÓJ_USERNAME"; // ZMIEŃ NA SWÓJ
        const REPO = "NAZWA_REPO";     // ZMIEŃ NA SWOJĄ
        const PATH = "command.lua";
        // ---------------------

        async function start() {
            if (params.get('kod') === '1') {
                document.body.innerHTML = "Wczytywanie...";
                const r = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/${PATH}?t=${Date.now()}`);
                const txt = await r.text();
                document.body.innerText = txt;
                document.body.style.whiteSpace = "pre";
                document.body.style.background = "#fff";
                document.body.style.color = "#000";
                return;
            }
        }

        async function updateFile() {
            const token = document.getElementById('token').value;
            const code = document.getElementById('code').value;
            const status = document.getElementById('status');
            const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`;

            if (!token) return alert("Brak tokenu!");

            status.innerText = "Łączenie z GitHub API...";
            try {
                const getFile = await fetch(url, { headers: { Authorization: `token ${token}` } });
                const fileData = await getFile.json();

                const res = await fetch(url, {
                    method: "PUT",
                    headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "Remote update " + Date.now(),
                        content: btoa(unescape(encodeURIComponent(code))), // Poprawne kodowanie UTF-8
                        sha: fileData.sha
                    })
                });

                if (res.ok) {
                    status.style.color = "#00ff41";
                    status.innerText = "✅ Sukces! Kod wysłany do pliku command.lua";
                } else {
                    const err = await res.json();
                    status.style.color = "#ff4141";
                    status.innerText = "❌ Błąd: " + err.message;
                }
            } catch (e) {
                status.innerText = "❌ Krytyczny błąd połączenia.";
            }
        }
        start();
    </script>
</body>
</html>
